<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deokwave piksel görselleri</title>
  <style>
    :root { --gece: #070b22; --kart: #0b1236; --cizgi: #22357f; --yazi: #e6edff; --soluk: #8fa3dc; --mor: #b9a6ff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px 56px; background: var(--gece); color: var(--yazi); font: 15px/1.6 "Segoe UI", system-ui, sans-serif; }
    header, section, footer { max-width: 880px; margin: 0 auto 28px; }
    h1 { margin: 0 0 6px; color: var(--mor); letter-spacing: .04em; }
    h2 { margin: 0 0 14px; font-size: 15px; color: var(--soluk); text-transform: uppercase; letter-spacing: .1em; }
    p { margin: 0; color: var(--soluk); }
    section { padding: 18px; background: var(--kart); border: 1px solid var(--cizgi); border-radius: 8px; }
    img { image-rendering: pixelated; }
    figure { margin: 0 0 14px; }
    figure img { display: block; width: 100%; }
    figcaption { margin-top: 4px; font-size: 13px; color: var(--soluk); }
    .satir { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .satir img { height: 40px; }
    .avatarlar { display: flex; gap: 18px; align-items: center; }
    .avatarlar img { width: 120px; height: 120px; }
    .avatarlar img.yuvarlak { border-radius: 50%; }
    .avatarlar img.kare { border-radius: 14px; }
    footer { text-align: center; font-size: 13px; color: var(--soluk); }
  </style>
</head>
<body>
  <header>
    <h1>Deokwave piksel görselleri</h1>
    <p>GitHub sayfalarımızda kullandığımız bütün piksel görseller tek sayfada. Görseller doğrudan depolardan yükleniyor.</p>
  </header>

  <section>
    <h2>Avatarlar</h2>
    <div class="avatarlar">
      <img class="kare" src="https://github.com/Deokwave.png?size=240" alt="Deokwave organizasyon avatarı">
      <img class="yuvarlak" src="https://github.com/Deokwv.png?size=240" alt="Deokwv avatarı">
    </div>
  </section>

  <section>
    <h2>Organizasyon sayfası</h2>
    <figure>
      <img src="https://raw.githubusercontent.com/Deokwave/.github/main/profile/assets/banner.svg" alt="Organizasyon banner'ı">
      <figcaption>Gece denizi, ay, Fuji ve hareketli dalgalar</figcaption>
    </figure>
    <div class="satir">
      <img src="https://raw.githubusercontent.com/Deokwave/.github/main/profile/assets/btn-site.svg" alt="deokwave.com">
      <img src="https://raw.githubusercontent.com/Deokwave/.github/main/profile/assets/btn-discord.svg" alt="Discord">
      <img src="https://raw.githubusercontent.com/Deokwave/.github/main/profile/assets/btn-instagram.svg" alt="Instagram">
      <img src="https://raw.githubusercontent.com/Deokwave/.github/main/profile/assets/btn-tiktok.svg" alt="TikTok">
    </div>
    <figure><img src="https://raw.githubusercontent.com/Deokwave/.github/main/profile/assets/tech.svg" alt="Oynatıcı teknolojileri"></figure>
    <figure><img src="https://raw.githubusercontent.com/Deokwave/.github/main/profile/assets/teknolojiler-v2.svg" alt="Kullandığımız teknolojiler"></figure>
    <figure><img src="https://raw.githubusercontent.com/Deokwave/.github/main/profile/assets/footer.svg" alt="Alt bilgi"></figure>
  </section>

  <section>
    <h2>Kişisel profil</h2>
    <figure><img src="https://raw.githubusercontent.com/Deokwv/Deokwv/main/assets/banner.svg" alt="Profil banner'ı"></figure>
    <figure><img src="https://raw.githubusercontent.com/Deokwv/Deokwv/main/assets/teknolojiler-v2.svg" alt="Teknolojiler"></figure>
  </section>

  <section>
    <h2>Depo başlıkları</h2>
    <figure><img src="https://raw.githubusercontent.com/Deokwave/deokwave/main/assets/banner.svg" alt="deokwave"></figure>
    <figure><img src="https://raw.githubusercontent.com/Deokwave/nami-4k/main/assets/banner.svg" alt="Nami 4K"></figure>
    <figure><img src="https://raw.githubusercontent.com/Deokwave/frame-generation/main/assets/banner.svg" alt="Frame Generation"></figure>
    <figure><img src="https://raw.githubusercontent.com/Deokwave/frc/main/assets/banner.svg" alt="FRC"></figure>
    <figure><img src="https://raw.githubusercontent.com/Deokwave/wavegen/main/assets/banner.svg" alt="Wavegen"></figure>
  </section>

  <footer>© 2026 Deokwave</footer>
</body>
</html>
